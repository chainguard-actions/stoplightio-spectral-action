name: Test unsupported event type handled gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up event file, OAS file, and ruleset in workspace
        run: |
          # Overwrite the actual GITHUB_EVENT_PATH with a push event fixture
          # (structure doesn't matter much for unsupported event test)
          cat > "$GITHUB_EVENT_PATH" <<'EOF'
          {
            "after": "abc1234567890abcdef1234567890abcdef123456",
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF

          # Copy the OAS fixture into workspace for linting
          cp "$GITHUB_WORKSPACE/tests/fixtures/valid.oas.yml" "$GITHUB_WORKSPACE/valid.oas.yml"
          # Copy the custom ruleset into workspace so spectral can find it
          cp "$GITHUB_WORKSPACE/tests/fixtures/custom.spectral.yml" "$GITHUB_WORKSPACE/custom.spectral.yml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          file_glob: "valid.oas.yml"
          spectral_ruleset: "custom.spectral.yml"
          repo_token: ${{ github.token }}
          event_name: workflow_dispatch

      - name: Assert action handled unsupported event gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses error() (not setFailed()) for unsupported events,
          # so it may exit 0 (success) or non-zero depending on implementation.
          # Either way, the action should not crash with an unhandled exception.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled unsupported event gracefully (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
